<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MN Groups — Property Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --navy-900:#0F1B33;
  --navy-700:#1C2E52;
  --navy-500:#2E4372;
  --brass-500:#B8902E;
  --brass-600:#98741F;
  --brass-100:#F1E6C9;
  --bg:#EFF2F6;
  --surface:#FFFFFF;
  --surface-sunken:#E7EBF1;
  --ink-900:#161B26;
  --ink-600:#4B5468;
  --ink-400:#828EA3;
  --line:#DCE1E9;
  --sky:#2F6BA6;
  --purple:#6E5A9E;
  --amber:#B37A1C;
  --teal:#177A82;
  --moss:#347A5C;
  --clay:#B14B41;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:22px;
  --font-head:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E14;
    --surface:#141926;
    --surface-sunken:#0F1420;
    --ink-900:#EDEFF4;
    --ink-600:#AFB7C8;
    --ink-400:#7A8296;
    --line:#232B3D;
    --navy-900:#0B1220;
    --navy-700:#141E33;
    --navy-500:#213052;
    --brass-100:#2A2413;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E14;
  --surface:#141926;
  --surface-sunken:#0F1420;
  --ink-900:#EDEFF4;
  --ink-600:#AFB7C8;
  --ink-400:#7A8296;
  --line:#232B3D;
  --navy-900:#0B1220;
  --navy-700:#141E33;
  --navy-500:#213052;
  --brass-100:#2A2413;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink-900);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
h1,h2,h3,.head{font-family:var(--font-head);letter-spacing:-0.01em;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* ---------- Shell ---------- */
#shell{min-height:100%;display:flex;flex-direction:column;}
.topbar{
  background:var(--navy-900);
  color:#fff;
  padding:10px 18px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  position:sticky;top:0;z-index:40;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:var(--brass-500);
  color:var(--navy-900);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:700;font-size:14px;
  flex:none;
}
.brand-word{font-family:var(--font-head);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-sub{font-size:11px;color:rgba(255,255,255,0.55);white-space:nowrap;}

.role-switch{
  display:flex;background:rgba(255,255,255,0.08);border-radius:999px;padding:3px;flex:none;
}
.role-switch button{
  border:none;background:transparent;color:rgba(255,255,255,0.65);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;
  transition:background .15s, color .15s;
}
.role-switch button.active{background:var(--brass-500);color:var(--navy-900);font-weight:600;}

.main{flex:1;display:flex;flex-direction:column;min-height:0;}

/* ---------- Toast ---------- */
#toast-wrap{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;z-index:200;pointer-events:none;padding:0 16px;}
.toast{
  background:var(--navy-900);color:#fff;padding:11px 18px;border-radius:999px;
  font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.25);
  display:flex;align-items:center;gap:8px;
  animation:toast-in .18s ease-out;
}
@keyframes toast-in{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--brass-500);flex:none;}

/* ---------- Phone-app frame (tenant/vendor) ---------- */
.app-stage{
  flex:1;display:flex;justify-content:center;padding:22px 16px 90px;
  background:
    radial-gradient(circle at 18% 8%, rgba(46,67,114,0.05), transparent 45%),
    var(--bg);
}
.phone{
  width:100%;max-width:428px;
  background:var(--surface);
  border-radius:var(--radius-lg);
  border:1px solid var(--line);
  overflow:hidden;
  display:flex;flex-direction:column;
  min-height:640px;
  box-shadow:0 1px 2px rgba(15,27,51,0.04);
}
@media (min-width:760px){
  .phone{box-shadow:0 24px 60px -20px rgba(15,27,51,0.28);}
}
.phone-head{
  background:var(--navy-700);color:#fff;padding:18px 20px 16px;
  display:flex;flex-direction:column;gap:10px;
}
.phone-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.phone-title{font-family:var(--font-head);font-size:19px;font-weight:600;}
.phone-eyebrow{font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px;}
.persona-select{
  background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.16);
  border-radius:var(--radius-sm);padding:7px 10px;font-size:12.5px;max-width:180px;
}
.persona-select option{color:#000;}
.phone-body{flex:1;overflow-y:auto;padding:18px 18px 26px;display:flex;flex-direction:column;gap:16px;}
.phone-nav{
  display:flex;border-top:1px solid var(--line);background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.phone-nav button{
  flex:1;background:none;border:none;padding:11px 4px 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-400);font-size:11px;
}
.phone-nav button.active{color:var(--brass-600);}
.phone-nav svg{width:20px;height:20px;}

/* ---------- generic bits ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:16px;
}
.section-title{font-size:12.5px;font-weight:600;color:var(--ink-600);margin:0 0 2px;}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-box{
  background:var(--surface-sunken);border-radius:var(--radius-md);padding:13px 14px;
  display:flex;flex-direction:column;gap:2px;
}
.stat-num{font-family:var(--font-head);font-size:22px;font-weight:700;}
.stat-label{font-size:11.5px;color:var(--ink-600);}

.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qa-btn{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-md);
  padding:13px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;
  font-size:13px;font-weight:600;color:var(--ink-900);
  transition:border-color .15s;
}
.qa-btn:hover{border-color:var(--brass-500);}
.qa-btn svg{width:19px;height:19px;color:var(--brass-600);}

.btn{
  border:none;border-radius:999px;padding:12px 18px;font-weight:600;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:filter .15s, transform .05s;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--brass-500);color:var(--navy-900);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-dark{background:var(--navy-900);color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink-900);}
.btn-block{width:100%;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-sm{padding:8px 13px;font-size:12.5px;}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-600);}
.field input[type=text], .field textarea, .field select{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;
  font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink-900);width:100%;
}
.field textarea{resize:vertical;min-height:80px;}
.field-error{font-size:12px;color:var(--clay);}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.cat-btn{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-md);
  padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  font-size:11.5px;font-weight:600;color:var(--ink-600);text-align:center;
}
.cat-btn .emo{font-size:19px;}
.cat-btn.sel{border-color:var(--brass-500);background:var(--brass-100);color:var(--ink-900);}

.complaint-card{
  border:1px solid var(--line);border-radius:var(--radius-md);padding:13px;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;background:var(--surface);
}
.complaint-card:hover{border-color:var(--navy-500);}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.cc-id{font-size:11.5px;color:var(--ink-400);font-weight:500;}
.cc-desc{font-size:13.5px;color:var(--ink-900);}
.cc-meta{font-size:11.5px;color:var(--ink-600);display:flex;gap:6px;flex-wrap:wrap;}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:11px;font-weight:600;white-space:nowrap;
}
.badge .bdot{width:6px;height:6px;border-radius:50%;}
.badge-submitted{background:#E7EFF7;color:var(--sky);}
.badge-assigned{background:#EEEAF6;color:var(--purple);}
.badge-progress{background:#FBF0DE;color:var(--amber);}
.badge-completed{background:#E4F3F3;color:var(--teal);}
.badge-closed{background:#E5F2EA;color:var(--moss);}
@media (prefers-color-scheme:dark){
  .badge-submitted{background:rgba(47,107,166,0.18);}
  .badge-assigned{background:rgba(110,90,158,0.2);}
  .badge-progress{background:rgba(179,122,28,0.2);}
  .badge-completed{background:rgba(23,122,130,0.2);}
  .badge-closed{background:rgba(52,122,92,0.2);}
}
:root[data-theme="dark"] .badge-submitted{background:rgba(47,107,166,0.18);}
:root[data-theme="dark"] .badge-assigned{background:rgba(110,90,158,0.2);}
:root[data-theme="dark"] .badge-progress{background:rgba(179,122,28,0.2);}
:root[data-theme="dark"] .badge-completed{background:rgba(23,122,130,0.2);}
:root[data-theme="dark"] .badge-closed{background:rgba(52,122,92,0.2);}

.back-row{display:flex;align-items:center;gap:10px;}
.back-btn{background:none;border:none;cursor:pointer;color:var(--ink-900);display:flex;padding:4px;}
.back-btn svg{width:19px;height:19px;}
.detail-title{font-family:var(--font-head);font-weight:600;font-size:16px;}

.timeline{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:12px;padding-bottom:16px;position:relative;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot-wrap{display:flex;flex-direction:column;align-items:center;}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--line);flex:none;margin-top:3px;}
.tl-dot.done{background:var(--moss);}
.tl-line{width:2px;flex:1;background:var(--line);margin-top:2px;}
.tl-body{flex:1;padding-bottom:2px;}
.tl-label{font-size:13.5px;font-weight:600;}
.tl-time{font-size:11.5px;color:var(--ink-400);}

.photo-row{display:flex;gap:8px;flex-wrap:wrap;}
.photo-thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line);}
.photo-add{
  width:72px;height:72px;border-radius:10px;border:1.5px dashed var(--line);background:none;
  display:flex;align-items:center;justify-content:center;color:var(--ink-400);cursor:pointer;
}
.photo-add svg{width:20px;height:20px;}

.stars{display:flex;gap:6px;}
.stars button{background:none;border:none;cursor:pointer;padding:0;}
.stars svg{width:30px;height:30px;color:var(--line);}
.stars svg.on{color:var(--brass-500);}

.tabs{display:flex;gap:6px;background:var(--surface-sunken);padding:4px;border-radius:999px;}
.tabs button{
  flex:1;border:none;background:none;padding:8px 6px;border-radius:999px;font-size:12.5px;
  font-weight:600;color:var(--ink-600);cursor:pointer;
}
.tabs button.active{background:var(--surface);color:var(--ink-900);box-shadow:0 1px 3px rgba(15,27,51,0.12);}

.empty{
  text-align:center;padding:34px 12px;color:var(--ink-400);display:flex;flex-direction:column;gap:8px;align-items:center;
}
.empty svg{width:34px;height:34px;color:var(--line);}

/* ---------- Admin ---------- */
.admin-shell{flex:1;display:flex;min-height:0;}
.sidebar{
  width:224px;flex:none;background:var(--navy-900);color:rgba(255,255,255,0.75);
  display:flex;flex-direction:column;padding:16px 12px;gap:2px;overflow-y:auto;
}
.side-link{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:500;cursor:pointer;background:none;border:none;color:inherit;text-align:left;width:100%;
}
.side-link svg{width:17px;height:17px;flex:none;}
.side-link.active{background:rgba(255,255,255,0.1);color:#fff;}
.side-link:not(.active):hover{background:rgba(255,255,255,0.05);}
.side-link.disabled{opacity:0.4;cursor:default;}
.side-note{font-size:10.5px;color:rgba(255,255,255,0.35);padding:12px 11px 4px;}

.admin-main{flex:1;overflow-y:auto;padding:22px 26px 60px;min-width:0;}
.admin-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.admin-h1{font-family:var(--font-head);font-size:21px;font-weight:600;}
.admin-sub{font-size:12.5px;color:var(--ink-600);margin-top:3px;}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:15px 16px;}
.kpi-label{font-size:12px;color:var(--ink-600);margin-bottom:6px;}
.kpi-num{font-family:var(--font-head);font-size:25px;font-weight:700;}
.kpi-sub{font-size:11px;color:var(--ink-400);margin-top:3px;}

.chart-row{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:18px;}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;}
.chart-card h3{font-size:13.5px;font-weight:600;margin:0 0 12px;}
.chart-wrap{position:relative;height:230px;}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;justify-content:center;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-600);}
.legend-dot{width:8px;height:8px;border-radius:50%;}

.table-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
.table-card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
.table-card-head h3{font-size:13.5px;font-weight:600;margin:0;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:640px;}
th{
  text-align:left;font-size:11px;font-weight:600;color:var(--ink-400);
  padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr.row-click{cursor:pointer;}
tr.row-click:hover td{background:var(--surface-sunken);}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;}
.filter-bar select, .filter-bar input{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 10px;font-size:12.5px;
  background:var(--surface);color:var(--ink-900);
}
.vendor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.vendor-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:15px;display:flex;flex-direction:column;gap:8px;}
.vendor-name{font-weight:600;font-size:14px;}
.vendor-cats{display:flex;gap:5px;flex-wrap:wrap;}
.chip{background:var(--surface-sunken);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--ink-600);}
.vendor-rating{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-600);}
.vendor-rating svg{width:14px;height:14px;color:var(--brass-500);}

.hamburger{display:none;background:none;border:none;color:#fff;padding:6px;cursor:pointer;}
.hamburger svg{width:21px;height:21px;}

@media (max-width:900px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .chart-row{grid-template-columns:1fr;}
}
@media (max-width:760px){
  .admin-shell{position:relative;}
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;z-index:100;
    transform:translateX(-100%);transition:transform .2s ease;
    padding-top:calc(16px + env(safe-area-inset-top,0px));
    box-shadow:0 0 0 2000px rgba(0,0,0,0);
  }
  .sidebar.open{transform:translateX(0);box-shadow:0 0 0 2000px rgba(0,0,0,0.4);}
  .hamburger{display:inline-flex;}
  .admin-main{padding:16px 14px 50px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
}
.help-text{font-size:12px;color:var(--ink-400);}
.section-gap{height:2px;}
.link-btn{background:none;border:none;color:var(--sky);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;}
</style>
</head>
<body>
<div id="shell">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">MN</div>
      <div style="min-width:0;">
        <div class="brand-word">MN Groups</div>
        <div class="brand-sub" id="topbar-sub">Property maintenance</div>
      </div>
    </div>
    <div class="role-switch" id="role-switch"></div>
  </div>
  <div class="main" id="main"></div>
</div>
<div id="toast-wrap"></div>

<script>
/* ============ ICONS ============ */
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V19a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-4 4.5-6 7.5-6s6 2 7.5 6"/></svg>',

/* ============ STATE ============ */
const STORAGE_KEY = 'mngroups_state_v1';
let state = {
  role: 'tenant',
  tenantId: 't1',
  tenantView: 'home',
  raiseDraft: {category:null, description:'', photos:[]},
  activeComplaintId: null,
  vendorId: 'v1',
  vendorTab: 'Assigned',
  adminView: 'dashboard',
  adminFilter: {status:'all', category:'all'},
  complaints: null
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved && Array.isArray(saved.complaints) && saved.complaints.length){
        state = Object.assign(state, saved);
        return;
      }
    }
  }catch(e){}
  state.complaints = seedComplaints();
}
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){}
}

/* ============ TOAST ============ */
function toast(msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="dot"></span><span>'+escapeHtml(msg)+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, 2200);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getComplaint(id){ return state.complaints.find(c=>c.id===id); }
function tenantComplaints(tenantId){
  return state.complaints.filter(c=>c.tenantId===tenantId).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
}
function vendorComplaints(vendorId){
  return state.complaints.filter(c=>c.vendorId===vendorId).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

let chartRefs = {};
function destroyCharts(){
  Object.values(chartRefs).forEach(c=>{ try{ c.destroy(); }catch(e){} });
  chartRefs = {};
}

function render(){
  persist();
  renderRoleSwitch();
  document.getElementById('topbar-sub').textContent =
    state.role==='tenant' ? 'Tenant app' : state.role==='vendor' ? 'Vendor app' : 'Admin & manager portal';
  const main = document.getElementById('main');
  destroyCharts();
  if(state.role==='tenant') main.innerHTML = renderTenantApp();
  else if(state.role==='vendor') main.innerHTML = renderVendorApp();
  else main.innerHTML = renderAdminApp();
  afterRender();
}

function renderRoleSwitch(){
  const roles = [['tenant','Tenant'],['vendor','Vendor'],['admin','Admin']];
  document.getElementById('role-switch').innerHTML = roles.map(([id,label])=>
    '<button class="'+(state.role===id?'active':'')+'" onclick="setRole(\''+id+'\')">'+label+'</button>'
  ).join('');
}
function setRole(role){
  state.role = role;
  if(role==='tenant') state.tenantView='home';
  if(role==='vendor') state.vendorTab='Assigned';
  if(role==='admin') state.adminView='dashboard';
  render();
}

/* ================= TENANT APP ================= */
function renderTenantApp(){
  const t = tenantInfo(state.tenantId);
  let body = '';
  if(state.tenantView==='home') body = tenantHome(t);
  else if(state.tenantView==='raise') body = tenantRaise();
  else if(state.tenantView==='track') body = tenantTrack(t);
  else if(state.tenantView==='detail') body = tenantDetail();
  else if(state.tenantView==='profile') body = tenantProfile(t);

  return '<div class="app-stage"><div class="phone">'
    + '<div class="phone-head">'
    +   '<div class="phone-head-top">'
    +     '<div><div class="phone-eyebrow">'+escapeHtml(t.property)+' \u00B7 '+escapeHtml(t.unit)+'</div><div class="phone-title">Hi, '+escapeHtml(t.name.split(' ')[0])+'</div></div>'
    +   '</div>'
    +   '<select class="persona-select" onchange="switchTenant(this.value)">'
    +     TENANTS.map(x=>'<option value="'+x.id+'" '+(x.id===state.tenantId?'selected':'')+'>Logged in as '+escapeHtml(x.name)+'</option>').join('')
    +   '</select>'
    + '</div>'
    + '<div class="phone-body">'+body+'</div>'
    + tenantNav()
    + '</div></div>';
}
function switchTenant(id){ state.tenantId = id; state.tenantView='home'; state.activeComplaintId=null; render(); }
function tenantNav(){
  const items = [['home','home','Home'],['raise','plus','Raise'],['track','list','Track'],['profile','user','Profile']];
  return '<div class="phone-nav">' + items.map(([id,ic,label])=>
    '<button class="'+((state.tenantView===id||(id==='track'&&state.tenantView==='detail'))?'active':'')+'" onclick="tenantGo(\''+id+'\')">'+icon(ic)+'<span>'+label+'</span></button>'
  ).join('') + '</div>';
}
function tenantGo(view){
  state.tenantView = view;
  if(view==='raise'){ state.raiseDraft = {category:null, description:'', photos:[]}; }
  render();
}

function tenantHome(t){
  const mine = tenantComplaints(t.id);
  const open = mine.filter(c=>c.status!=='Closed').length;
  const closed = mine.filter(c=>c.status==='Closed').length;
  const recent = mine.slice(0,3);
  return ''
  + '<div class="stat-row">'
  +   '<div class="stat-box"><div class="stat-num">'+open+'</div><div class="stat-label">Open requests</div></div>'
  +   '<div class="stat-box"><div class="stat-num">'+closed+'</div><div class="stat-label">Completed</div></div>'
  + '</div>'
  + '<div class="quick-actions">'
  +   '<button class="qa-btn" onclick="tenantGo(\'raise\')">'+icon('plus')+'Raise a complaint</button>'
  +   '<button class="qa-btn" onclick="callManager()">'+icon('phone')+'Call property manager</button>'
  + '</div>'
  + '<div>'
  +   '<div class="section-title" style="margin-bottom:8px;">Recent requests</div>'
  +   (recent.length? '<div style="display:flex;flex-direction:column;gap:9px;">'+recent.map(complaintCard).join('')+'</div>'
       : emptyState('inbox','No requests yet','Raise your first maintenance request to get started.'))
  + '</div>';
}
function emptyState(ic,title,sub){
  return '<div class="empty">'+icon(ic)+'<div style="font-weight:600;color:var(--ink-900);font-size:13.5px;">'+title+'</div><div style="font-size:12px;">'+sub+'</div></div>';
}
function complaintCard(c){
  const cat = catInfo(c.category);
  const meta = STATUS_META[c.status];
  return '<div class="complaint-card" onclick="openComplaint(\''+c.id+'\')">'
    + '<div class="cc-top"><span class="cc-id">'+c.id+'</span>'
    + '<span class="badge '+meta.cls+'"><span class="bdot" style="background:'+meta.color+'"></span>'+meta.label+'</span></div>'
    + '<div class="cc-desc">'+cat.emo+' '+escapeHtml(cat.name)+' \u2014 '+escapeHtml(truncate(c.description,60))+'</div>'
    + '<div class="cc-meta"><span>'+fmtShort(c.createdAt)+'</span>'+(c.vendorId?'<span>\u00B7 '+escapeHtml(vendorInfo(c.vendorId).name)+'</span>':'')+'</div>'
    + '</div>';
}
function truncate(s,n){ return s.length>n ? s.slice(0,n-1)+'\u2026' : s; }
function openComplaint(id){ state.activeComplaintId = id; state.tenantView='detail'; render(); }

async function addRaisePhoto(ev){

function submitComplaint(){
  const d = state.raiseDraft;
  const errEl = document.getElementById('raise-error');
  if(!d.category){ errEl.textContent = 'Choose a category to continue.'; return; }
  if(!d.description || d.description.trim().length<4){ errEl.textContent = 'Add a short description of the issue.'; return; }
  const t = tenantInfo(state.tenantId);
  const cat = catInfo(d.category);
  const c = {
    id: nextComplaintId(),
    tenantId: t.id, property: t.property, unit: t.unit,
    category: d.category, description: d.description.trim(),
    status: 'Assigned', vendorId: cat.vendor,
    createdAt: new Date().toISOString(), assignedAt: new Date().toISOString(),
    beforePhotos: d.photos.slice(), afterPhotos: [], rating:0, feedback:'', materials:'', report:''
  };
  state.complaints.unshift(c);
  toast('Complaint submitted \u00B7 '+vendorInfo(cat.vendor).name+' assigned');
  state.tenantView = 'track';
  render();
}

function tenantDetail(){

  const vendor = c.vendorId ? vendorInfo(c.vendorId) : null;

    {key:'Submitted', label:'Complaint submitted', time:c.createdAt},
    {key:'Assigned', label:'Vendor assigned'+(vendor?': '+vendor.name:''), time:c.assignedAt},
    {key:'In Progress', label:'Vendor started the job', time:c.startedAt},
    {key:'Completed', label:'Repair completed by vendor', time:c.completedAt},
    {key:'Closed', label:'Verified & closed', time:c.verifiedAt||c.closedAt}
  ];

  + '<div class="card" style="display:flex;flex-direction:column;gap:10px;">'

  +     '<div><div class="cc-id">'+c.id+'</div><div style="font-weight:600;font-size:14.5px;margin-top:2px;">'+cat.emo+' '+escapeHtml(cat.name)+'</div></div>'
  +     '<span class="badge '+STATUS_META[c.status].cls+'"><span class="bdot" style="background:'+STATUS_META[c.status].color+'"></span>'+STATUS_META[c.status].label+'</span>'
  +   '</div>'
  +   '<div style="font-size:13.5px;color:var(--ink-600);">'+escapeHtml(c.description)+'</div>'
  +   (vendor? '<div class="help-text">Assigned to '+escapeHtml(vendor.name)+' \u00B7 '+vendor.phone+'</div>':'')
  + '</div>'
  + (c.beforePhotos.length? '<div><div class="section-title" style="margin-bottom:8px;">Photos you added</div><div class="photo-row">'+c.beforePhotos.map(p=>'<img class="photo-thumb" src="'+p+'">').join('')+'</div></div>':'')
  + '<div class="card"><div class="section-title" style="margin-bottom:10px;">Status timeline</div>'
  +   '<div class="timeline">'
  +   steps.map((s,i)=>{
        const done = i<=curIdx && s.time;
        return '<div class="tl-item">'
          + '<div class="tl-dot-wrap"><div class="tl-dot '+(done?'done':'')+'"></div>'+(i<steps.length-1?'<div class="tl-line"></div>':'')+'</div>'
          + '<div class="tl-body"><div class="tl-label" style="color:'+(done?'var(--ink-900)':'var(--ink-400)')+';">'+s.label+'</div>'+(s.time? '<div class="tl-time">'+fmt(s.time)+'</div>':'')+'</div>'
          + '</div>';
      }).join('')

  + (c.status==='Completed' && c.afterPhotos.length? '<div><div class="section-title" style="margin-bottom:8px;">Completion photos</div><div class="photo-row">'+c.afterPhotos.map(p=>'<img class="photo-thumb" src="'+p+'">').join('')+'</div>'+(c.report?'<div class="help-text" style="margin-top:8px;">'+escapeHtml(c.report)+'</div>':'')+'</div>':'')
  + (c.status==='Completed' ? tenantVerifyBlock(c) : '')
  + (c.status==='Closed' ? tenantClosedBlock(c) : '');
}
function backRow(view,title){
  return '<div class="back-row"><button class="back-btn" onclick="tenantGo(\''+view+'\')">'+icon('back')+'</button><div class="detail-title">'+title+'</div></div>';

function tenantVerifyBlock(c){

    + '<div class="section-title">Rate the service</div>'
    + starPicker(c.id)
    + '<div class="field"><textarea id="fb-'+c.id+'" placeholder="Optional feedback for '+escapeHtml(vendorInfo(c.vendorId).name)+'"></textarea></div>'
    + '<button class="btn btn-primary btn-block" onclick="verifyComplaint(\''+c.id+'\')">'+icon('check')+'Verify & close request</button>'
    + '</div>';

function starPicker(id){
  const c = getComplaint(id);
  const cur = state.tempRating && state.tempRating.id===id ? state.tempRating.value : c.rating;
  let html = '<div class="stars">';
  for(let i=1;i<=5;i++){
    html += '<button onclick="setTempRating(\''+id+'\','+i+')">'+iconStar(i<=cur)+'</button>';
  }
  html += '</div>';
  return html;
}
function iconStar(on){
  return '<svg class="'+(on?'on':'')+'" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.8l2.7 5.9 6.4.7-4.8 4.4 1.3 6.4-5.6-3.2-5.6 3.2 1.3-6.4-4.8-4.4 6.4-.7Z"/></svg>';
}
function setTempRating(id,val){
  state.tempRating = {id, value:val};
  render();
}
function verifyComplaint(id){
  const c = getComplaint(id);
  const rating = (state.tempRating && state.tempRating.id===id) ? state.tempRating.value : 0;
  if(!rating){ toast('Pick a star rating first'); return; }
  const fbEl = document.getElementById('fb-'+id);
  c.rating = rating;
  c.feedback = fbEl ? fbEl.value.trim() : '';
  c.verifiedAt = new Date().toISOString();
  c.closedAt = new Date().toISOString();
  c.status = 'Closed';
  state.tempRating = null;
  toast('Thanks! Request closed and manager notified');
  render();
}
function tenantClosedBlock(c){

    + '<div class="section-title">Your rating</div>'
    + '<div class="stars">'+[1,2,3,4,5].map(i=>iconStar(i<=c.rating)).join('')+'</div>'

    + '</div>'
    + '<div class="field"><label>Materials used</label><input type="text" id="mat-'+c.id+'" placeholder="e.g. Tap washer, plumber\u2019s tape" value="'+escapeHtml(c.materials)+'"></div>'
    + '<div class="field"><label>Completion notes</label><textarea id="rep-'+c.id+'" placeholder="What was done to fix the issue?">'+escapeHtml(c.report)+'</textarea></div>'
    + '<div id="complete-error" class="field-error"></div>'

async function addAfterPhoto(ev,id){
  const file = ev.target.files[0];
  if(!file) return;
  try{
    const url = await fileToDataUrl(file);
    getComplaint(id).afterPhotos.push(url);
    render();
  }catch(e){ toast('Could not load that photo'); }
}
function submitJobReport(id){
  const c = getComplaint(id);
  const rep = document.getElementById('rep-'+id).value.trim();
  const mat = document.getElementById('mat-'+id).value.trim();
  const err = document.getElementById('complete-error');
  if(!c.afterPhotos.length){ err.textContent = 'Add at least one completion photo.'; return; }
  if(!rep){ err.textContent = 'Add a short note on what was done.'; return; }
  c.report = rep; c.materials = mat;
  c.status = 'Completed';
  c.completedAt = new Date().toISOString();
  toast('Report submitted \u00B7 tenant will be notified');
  render();
}

function adminDashboard(){
  const all = state.complaints;
  const open = all.filter(c=>c.status!=='Closed').length;
  const now = new Date();
  const completedThisMonth = all.filter(c=>c.closedAt && new Date(c.closedAt).getMonth()===now.getMonth() && new Date(c.closedAt).getFullYear()===now.getFullYear()).length;
  const ratings = all.filter(c=>c.rating).map(c=>c.rating);
  const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '\u2014';

  const catCounts = {};
  CATEGORIES.forEach(c=>catCounts[c.id]=0);
  all.forEach(c=>{ catCounts[c.category] = (catCounts[c.category]||0)+1; });
  const catEntries = Object.entries(catCounts).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);

  const recent = all.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,6);

  return ''

  + '<div class="kpi-row">'
  +   kpi('Total properties', PROPERTIES.length, PROPERTIES.length+' active sites')
  +   kpi('Total tenants', TENANTS.length, 'across all properties')
  +   kpi('Open complaints', open, 'awaiting resolution')

  + '</div>'
  + '<div class="chart-row">'
  +   '<div class="chart-card"><h3>Complaints overview \u2014 last 6 weeks</h3><div class="chart-wrap"><canvas id="chart-trend"></canvas></div></div>'
  +   '<div class="chart-card"><h3>Complaints by category</h3><div class="chart-wrap"><canvas id="chart-cat"></canvas></div>'
  +     '<div class="legend-row">'+catEntries.map(([id,v],i)=>'<span class="legend-item"><span class="legend-dot" style="background:'+catColor(i)+'"></span>'+catInfo(id).name+' ('+v+')</span>').join('')+'</div>'
  +   '</div>'
  + '</div>'
  + '<div class="table-card">'
  +   '<div class="table-card-head"><h3>Recent complaints</h3><button class="link-btn" onclick="adminGo(\'complaints\')">View all</button></div>'

  + '</div>';

function adminComplaintDetail(){
  const c = getComplaint(state.activeComplaintId);
  if(!c) return emptyState('inbox','Not found','Pick a complaint from the list.');
  const cat = catInfo(c.category);
  const t = tenantInfo(c.tenantId);
  const vendor = c.vendorId ? vendorInfo(c.vendorId) : null;
  return '<div class="back-row" style="margin-bottom:14px;"><button class="back-btn" onclick="adminGo(\'complaints\')">'+icon('back')+'</button><div class="detail-title">'+c.id+'</div>'
    + '<span class="badge '+STATUS_META[c.status].cls+'" style="margin-left:6px;"><span class="bdot" style="background:'+STATUS_META[c.status].color+'"></span>'+STATUS_META[c.status].label+'</span></div>'
    + '<div class="chart-row" style="grid-template-columns:1.3fr 1fr;align-items:start;">'
    +   '<div class="card" style="display:flex;flex-direction:column;gap:10px;">'
    +     '<div style="font-weight:600;font-size:15px;">'+cat.emo+' '+cat.name+'</div>'
    +     '<div style="font-size:13.5px;color:var(--ink-600);">'+escapeHtml(c.description)+'</div>'
    +     (c.beforePhotos.length? '<div class="photo-row">'+c.beforePhotos.map(p=>'<img class="photo-thumb" src="'+p+'">').join('')+'</div>':'')
    +     (c.report? '<div style="height:1px;background:var(--line);"></div><div class="section-title">Vendor report</div><div style="font-size:13px;">'+escapeHtml(c.report)+'</div>'+(c.materials?'<div class="help-text">Materials: '+escapeHtml(c.materials)+'</div>':''):'')
    +     (c.afterPhotos.length? '<div class="photo-row">'+c.afterPhotos.map(p=>'<img class="photo-thumb" src="'+p+'">').join('')+'</div>':'')
    +     (c.rating? '<div><div class="section-title">Tenant rating</div><div class="stars">'+[1,2,3,4,5].map(i=>iconStar(i<=c.rating)).join('')+'</div>'+(c.feedback?'<div class="help-text">\u201C'+escapeHtml(c.feedback)+'\u201D</div>':'')+'</div>':'')
    +   '</div>'
    +   '<div class="card" style="display:flex;flex-direction:column;gap:8px;">'
    +     '<div class="section-title">Property</div><div style="font-size:13.5px;">'+escapeHtml(c.property)+', '+escapeHtml(c.unit)+'</div>'
    +     '<div class="section-title" style="margin-top:6px;">Tenant</div><div style="font-size:13.5px;">'+escapeHtml(t.name)+'</div><div class="help-text">'+t.phone+'</div>'
    +     (vendor? '<div class="section-title" style="margin-top:6px;">Vendor</div><div style="font-size:13.5px;">'+escapeHtml(vendor.name)+'</div><div class="help-text">'+vendor.phone+'</div>' : '<div class="help-text" style="margin-top:6px;">No vendor assigned yet</div>')
    +     '<div class="section-title" style="margin-top:6px;">Raised</div><div class="help-text">'+fmt(c.createdAt)+'</div>'
    +   '</div>'
    + '</div>';
}

function adminVendors(){
  return '<div class="admin-head"><div><div class="admin-h1">Vendors</div><div class="admin-sub">'+VENDORS.length+' registered vendors</div></div></div>'
    + '<div class="vendor-grid">'
    +   VENDORS.map(v=>{
          const active = state.complaints.filter(c=>c.vendorId===v.id && c.status!=='Closed').length;
          return '<div class="vendor-card">'
            + '<div class="vendor-name">'+escapeHtml(v.name)+'</div>'
            + '<div class="vendor-cats">'+v.categories.map(cid=>'<span class="chip">'+catInfo(cid).name+'</span>').join('')+'</div>'
            + '<div class="vendor-rating">'+icon('star')+v.rating+' \u00B7 '+v.jobsDone+' jobs done</div>'
            + '<div class="help-text">'+v.phone+'</div>'
            + '<div class="help-text">'+active+' active job'+(active===1?'':'s')+' right now</div>'
            + '</div>';
        }).join('')
    + '</div>';
}
function adminProperties(){
  return '<div class="admin-head"><div><div class="admin-h1">Properties</div><div class="admin-sub">'+PROPERTIES.length+' managed properties</div></div></div>'
    + '<div class="vendor-grid">'
    +   PROPERTIES.map(p=>{
          const openCount = state.complaints.filter(c=>c.property===p.name && c.status!=='Closed').length;
          const tenantCount = TENANTS.filter(t=>t.property===p.name).length;
          return '<div class="vendor-card">'
            + '<div class="vendor-name">'+icon('bldg')+' '+escapeHtml(p.name)+'</div>'
            + '<div class="chip" style="width:fit-content;">'+p.type+'</div>'
            + '<div class="help-text">'+escapeHtml(p.address)+'</div>'
            + '<div class="help-text">Manager: '+escapeHtml(p.manager)+'</div>'
            + '<div class="help-text">'+tenantCount+' tenants \u00B7 '+openCount+' open complaint'+(openCount===1?'':'s')+'</div>'
            + '</div>';
        }).join('')
    + '</div>';
}
function adminTenants(){
  return '<div class="admin-head"><div><div class="admin-h1">Tenants</div><div class="admin-sub">'+TENANTS.length+' registered tenants</div></div></div>'
    + '<div class="table-card"><div class="table-scroll"><table>'
    +   '<tr><th>Name</th><th>Property</th><th>Unit</th><th>Phone</th><th>Open</th><th>Closed</th></tr>'
    +   TENANTS.map(t=>{
          const mine = state.complaints.filter(c=>c.tenantId===t.id);
          const open = mine.filter(c=>c.status!=='Closed').length;
          const closed = mine.filter(c=>c.status==='Closed').length;
          return '<tr><td>'+escapeHtml(t.name)+'</td><td>'+escapeHtml(t.property)+'</td><td>'+escapeHtml(t.unit)+'</td><td>'+t.phone+'</td><td>'+open+'</td><td>'+closed+'</td></tr>';
        }).join('')
    + '</table></div></div>';
}

/* ============ CHARTS ============ */
function buildCharts(){
  if(typeof Chart === 'undefined') return;
  const trendCanvas = document.getElementById('chart-trend');
  if(trendCanvas){
    const weeks = [];
    const openSeries = [];
    const closedSeries = [];
    for(let w=5; w>=0; w--){
      const start = new Date(); start.setDate(start.getDate() - (w*7+6));
      const end = new Date(); end.setDate(end.getDate() - (w*7));
      weeks.push(w===0?'This week':fmtShort(start.toISOString()));
      const inRange = state.complaints.filter(c=>{
        const d = new Date(c.createdAt);
        return d>=start && d<=end;
      });
      openSeries.push(inRange.filter(c=>c.status!=='Closed').length);
      closedSeries.push(inRange.filter(c=>c.status==='Closed').length);
    }
    chartRefs.trend = new Chart(trendCanvas, {
      type:'line',
      data:{ labels:weeks, datasets:[
        {label:'Raised', data:openSeries.map((v,i)=>v+closedSeries[i]), borderColor:'#B37A1C', backgroundColor:'rgba(179,122,28,0.08)', tension:0.35, fill:true, pointRadius:3},
        {label:'Closed', data:closedSeries, borderColor:'#347A5C', backgroundColor:'rgba(52,122,92,0.08)', tension:0.35, fill:true, pointRadius:3}
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{position:'bottom', labels:{boxWidth:8, usePointStyle:true, font:{size:11}}}},
        scales:{ y:{ beginAtZero:true, ticks:{precision:0, font:{size:11}}, grid:{color:'rgba(130,142,163,0.15)'} }, x:{ ticks:{font:{size:11}}, grid:{display:false} } }
      }
    });
  }
  const catCanvas = document.getElementById('chart-cat');
  if(catCanvas){
    const catCounts = {};
    CATEGORIES.forEach(c=>catCounts[c.id]=0);
    state.complaints.forEach(c=>{ catCounts[c.category] = (catCounts[c.category]||0)+1; });
    const entries = Object.entries(catCounts).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    chartRefs.cat = new Chart(catCanvas, {
      type:'doughnut',
      data:{ labels: entries.map(([id])=>catInfo(id).name), datasets:[{ data: entries.map(([,v])=>v), backgroundColor: entries.map((_,i)=>catColor(i)), borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{display:false}} }
    });
  }
}

/* ============ AFTER RENDER ============ */
function afterRender(){
  if(state.role==='admin' && state.adminView==='dashboard'){
    buildCharts();
  }
}

/* ============ INIT ============ */
loadState();
render();
window.addEventListener('resize', ()=>{ if(state.role==='admin') closeSidebar(); });
</script>
